<!doctype html><html lang="bs"><head><script async src="https://www.googletagmanager.com/gtag/js?id=G-4WRS80K94M"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","G-4WRS80K94M");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Namaski šarti – interaktivna lekcija</title><style>:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#f9f3dd;background:#0c211b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#123c30,#081d19);min-height:100dvh}header{background:#16533f;text-align:center;padding:17px 10px;border-bottom:3px solid #e8c46e}h1{font-size:clamp(23px,6vw,36px);margin:0;color:#f9d783}header p{margin:5px 0 0;font-size:13px}main{max-width:860px;margin:auto;padding:12px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.menu button,.action,.answer,.tile{border:1px solid #b79b57;border-radius:14px;background:#1d5a49;color:white;padding:13px 9px;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}.menu button{min-height:59px;font-size:14px}.menu button.active{background:#e6c56f;color:#18271f}.panel{border:1px solid #8d895d;border-radius:20px;background:#143b31;margin-top:13px;padding:17px}.panel h2{margin:0 0 12px;color:#ffe29b;font-size:23px}.muted{color:#d6d5c9}.score{display:flex;justify-content:space-between;gap:10px;margin:12px 4px}.bar{height:9px;background:#496d61;border-radius:9px;overflow:hidden}.bar span{display:block;background:#efce79;height:100%;width:0;transition:width .3s}.card{background:#225746;border:1px solid #7b987b;border-radius:17px;padding:18px;margin:13px 0;line-height:1.5}.card h3{margin:0 0 9px;color:#ffe49d}.card strong{font-size:20px}.answers{display:grid;gap:9px}.answer{font-size:16px;text-align:left;min-height:55px;font-weight:600}.answer.correct,.tile.correct{background:#16804c}.answer.wrong,.tile.wrong{background:#963c39}.answer:disabled{opacity:.85}.actions{display:flex;gap:9px;flex-wrap:wrap}.action{flex:1}.small{font-size:13px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{min-height:65px;font-size:14px}.picked{outline:3px solid #ffe29b}.hidden{display:none}.feedback{min-height:27px;font-weight:700;color:#ffe29b;margin:12px 0}.tag{display:inline-block;border:1px solid #cfb86e;border-radius:20px;padding:4px 9px;margin:3px;font-size:12px}.gold{color:#ffe29b}@media(max-width:380px){.menu button{font-size:12px}.panel{padding:12px}.answer{font-size:14px}}</style></head><body><header><h1>🕌 NAMASKI ŠARTI</h1><p>Interaktivna mektebska lekcija • Pripremio Abdo ef. Rekić</p></header><main><nav class="menu" id="menu"></nav><div class="score"><span id="points">Bodovi: 0</span><span id="counter">1 / 7</span></div><div class="bar"><span id="progress"></span></div><section class="panel" id="screen"></section></main><script>
const stages=['📖 NAUČI','🧩 SPOJI','🔢 SLOŽI REDOM','❓ ŠTA NEDOSTAJE?','🔎 PREPOZNAJ PO ZNAČENJU','⚡ BRZI IZAZOV','🏆 ZAVRŠNI ISPIT'];
const U=[['Da bude čisto tijelo, odjeća i mjesto za klanjanje','Čistoća tijela, odjeće i mjesta'],['Uzeti abdest ili po potrebi se okupati i uzeti tejemum','Abdest, gusul ili tejemum po potrebi'],['Biti propisno obučen','Propisna odjeća'],['Na vrijeme klanjati','Namasko vrijeme'],['Prema Kibli se okrenuti','Okretanje prema Kibli'],['Nijet učiniti – odlučiti klanjati namaz','Nijet']];
const R=[['Iftitahi-tekbir','Početni tekbir'],['Kijam','Stajanje u namazu'],['Kiraet','Učenje Kur’ana u namazu'],['Ruku’','Pregibanje u namazu'],['Sedžda','Spuštanje lica na tlo'],['Kadei-ehire','Sjedenje na kraju namaza']];
const all=[...U.map((x,i)=>({name:x[0],meaning:x[1],kind:'uvjet',num:i+1})),...R.map((x,i)=>({name:x[0],meaning:x[1],kind:'rukn',num:i+1}))];
const facts=[['Koliko ukupno ima namaskih šarta?','12',['6','10','14']],['Koliko ima namaskih uvjeta?','6',['5','7','12']],['Koliko ima namaskih ruknova?','6',['5','7','12']],['Kada se ispunjavaju namaski uvjeti?','Prije klanjanja namaza',['Samo poslije namaza','Samo na posljednjem rekatu','Tek nakon selama']],['Kada se obavljaju namaski ruknovi?','U toku namaza',['Prije abdesta','Samo prije početnog tekbira','Nakon završetka namaza']],['Šta su namaski šarti?','Uvjeti koje treba ispuniti kako bi namaz bio ispravan',['Samo dobrovoljni namazi','Samo dove poslije namaza','Samo namaska vremena']],['Šta su namaski ruknovi?','Sastavni dijelovi namaza',['Pripreme prije namaza','Namaska vremena','Vrste abdesta']],['Šta su namaski uvjeti?','Pripreme za namaz',['Sastavni dijelovi u toku namaza','Dove nakon namaza','Nazivi pet dnevnih namaza']],['Kada namaz nije ispravan?','Kada nisu ispunjeni svi namaski šarti',['Kada je proučena Fatiha','Kada se klanja u njegovom vremenu','Kada je učinjen nijet']]];
const sh=a=>[...a].sort(()=>Math.random()-.5);let stage=0,step=0,points=0,locked=false,queue=[],pairs=[],selected=null,sequence=[],timer=null,currentOptions=[],currentAnswer="";const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tone(ok){try{let C=window.AudioContext||window.webkitAudioContext;let ctx=window._audioCtx||(window._audioCtx=new C()),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?650:260,ctx.currentTime);if(ok)o.frequency.setValueAtTime(900,ctx.currentTime+.12);else o.frequency.setValueAtTime(160,ctx.currentTime+.12);g.gain.setValueAtTime(.11,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.28);o.start();o.stop(ctx.currentTime+.3);o.onended=()=>{}}catch(e){}}
function update(){el('menu').innerHTML=stages.map((s,i)=>`<button class="${i===stage?'active':''}" onclick="go(${i})">${i+1}. ${s}</button>`).join('');el('points').textContent='Bodovi: '+points;el('counter').textContent=`Etapa ${stage+1} / 7`;el('progress').style.width=((stage+1)/7*100)+'%'}
function go(n){clearTimeout(timer);stage=n;step=0;locked=false;selected=null;sequence=[];queue=[];pairs=[];if(stage===1)pairs=sh(all).slice(0,6);if(stage===2)sequence=sh(U.map((x,i)=>i));if(stage>=3)makeQueue();render()}
function award(ok){tone(ok);points+=ok?10:-3;el('points').textContent='Bodovi: '+points;el('feedback').textContent=ok?'✓ Tačno! +10 bodova':'✗ Netačno. −3 boda';el('feedback').style.color=ok?'#8ef1a9':'#ffb2a6'}
function next(){clearTimeout(timer);step++;locked=false;selected=null;render()}
function automatic(){timer=setTimeout(next,1050)}
function question(q,opts,answer){let options=sh([...new Set([answer,...sh(opts).slice(0,3)])]);if(options.length<4){for(let v of sh(all.map(x=>x.name))){if(!options.includes(v))options.push(v);if(options.length===4)break}}return{q,opts:sh(options.slice(0,4)),answer}}
function makeQueue(){let q=[];if(stage===3){q=all.map(x=>{let arr=x.kind==='uvjet'?U:R;let before=x.num>1?arr[x.num-2][0]:'POČETAK';let after=x.num<6?arr[x.num][0]:'KRAJ';return question('Šta nedostaje u redoslijedu? '+before+' → ❓ → '+after,all.filter(y=>y.kind===x.kind&&y.name!==x.name).map(y=>y.name),x.name)})}else if(stage===4){q=all.map(x=>question('Šta znači: '+x.name+'?',all.filter(y=>y.kind===x.kind&&y.meaning!==x.meaning).map(y=>y.meaning),x.meaning))}else{let a=all.map(x=>question('Koji je '+(x.kind==='uvjet'?'namaski uvjet':'namaski rukn')+' opisan kao: '+x.meaning+'?',all.filter(y=>y.kind===x.kind&&y.name!==x.name).map(y=>y.name),x.name));let b=facts.map(x=>question(x[0],x[2],x[1]));let c=all.map(x=>question('Koje značenje odgovara pojmu „'+x.name+'“?',all.filter(y=>y.kind===x.kind&&y.meaning!==x.meaning).map(y=>y.meaning),x.meaning));q=sh([...a,...b,...c]);if(stage===6)q=q.slice(0,30);else q=q.slice(0,12)}queue=sh(q)}
function render(){update();let s=el('screen');if(stage===0){let cards=[{title:'Namaski šarti',body:'Namaski šarti su uvjeti koje trebamo ispuniti kako bi nam namaz bio ispravan. Ukupno ih je 12: šest namaskih uvjeta (pripreme za namaz) i šest namaskih ruknova (sastavni dijelovi namaza). Bez ispunjavanja svih namaskih šarta, namaz nije ispravan.'},...U.map((x,i)=>({title:`${i+1}. namaski uvjet`,body:x[0]})),...R.map((x,i)=>({title:`${i+1}. namaski rukn: ${x[0]}`,body:x[1]}))];let x=cards[step];if(!x){s.innerHTML='<h2>Bravo! Završeno učenje.</h2><button class="action" onclick="go(1)">Pređi na SPOJI →</button>';return}s.innerHTML=`<h2>📖 NAUČI</h2><p class="muted">Kartica ${step+1} / ${cards.length}</p><div class="card"><h3>${esc(x.title)}</h3><strong>${esc(x.body)}</strong></div><div class="actions"><button class="action" onclick="step=Math.max(0,step-1);render()">← Nazad</button><button class="action" onclick="next()">Dalje →</button></div>`;return}
if(stage===1){if(step>=pairs.length){finish();return}let x=pairs[step];let options=sh([x.meaning,...sh(all.filter(y=>y.kind===x.kind&&y.meaning!==x.meaning).map(y=>y.meaning)).slice(0,3)]);currentOptions=options;currentAnswer=x.meaning;s.innerHTML=`<h2>🧩 SPOJI</h2><p>Par ${step+1} / ${pairs.length}</p><div class="card"><strong>${esc(x.name)}</strong><p>Odaberi odgovarajuće značenje.</p></div><div class="answers">${options.map(o=>`<button class="answer" onclick="chooseIndex(this,${options.indexOf(o)})">${esc(o)}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`;return}
if(stage===2){if(step>=6){finish();return}let correct=step;let opts=sequence.slice();s.innerHTML=`<h2>🔢 SLOŽI REDOM</h2><p>Izaberi ${step+1}. namaski uvjet (bez prikazanih rednih brojeva).</p><div class="tiles">${opts.map(i=>`<button class="tile" onclick="order(this,${i})">${esc(U[i][0])}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`;return}
if(step>=queue.length){finish();return}let x=queue[step];currentOptions=x.opts;currentAnswer=x.answer;s.innerHTML=`<h2>${stages[stage]}</h2><p class="muted">Pitanje ${step+1} / ${queue.length}</p><div class="card"><strong>${esc(x.q)}</strong></div><div class="answers">${x.opts.map(o=>`<button class="answer" onclick="chooseIndex(this,${x.opts.indexOf(o)})">${esc(o)}</button>`).join('')}</div><p class="feedback" id="feedback"></p>`}
function chooseIndex(btn,index){let value=currentOptions[index],correct=currentAnswer;if(locked)return;locked=true;let ok=value===correct;btn.classList.add(ok?'correct':'wrong');document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct')});award(ok);automatic()}
function order(btn,i){if(locked)return;let ok=i===step;btn.classList.add(ok?'correct':'wrong');if(ok){locked=true;sequence=sequence.filter(v=>v!==i);award(true);automatic()}else{award(false);timer=setTimeout(()=>btn.classList.remove('wrong'),550)}}
function finish(){el('screen').innerHTML=`<h2>🎉 Etapa završena!</h2><div class="card"><strong>Ukupno bodova: ${points}</strong><p>Uspješno si prošao/la ovu etapu.</p></div><button class="action" onclick="go(${Math.min(6,stage+1)})">${stage===6?'Ponovi završni ispit':'Sljedeća etapa →'}</button>`}go(0);
</script></body></html>
